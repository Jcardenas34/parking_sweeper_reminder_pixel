# Conda environment for building Pixel Parking from WSL.
#   conda env create -f environment.yml && conda activate pixel-parking
name: pixel-parking
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pillow
  - pytest
  - nodejs=22
  - openjdk=21      # Android builds (Gradle / Android Gradle Plugin need JDK 17+)
  - pip
  - pip:
      - -e ./backend
